<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
// ALWAYS RUN THE NEWEST BUILD.
//
// GitHub Pages serves every file with `Cache-Control: max-age=600` and offers
// no way to set headers, so freshness is enforced from the client side:
//
//  1. scripts/stamp-build.mjs appends ?v=<version> to every asset URL at deploy
//     time, so a new build is a set of URLs no browser has ever cached. That
//     covers the whole module graph, not just the entry point.
//  2. index.html ITSELF can still be served stale (up to Pages' 10 minutes, and
//     Safari is happy to hold it longer). The check below catches exactly that:
//     the running document knows the version it was built with, so it asks the
//     server what is actually deployed and reloads once if they disagree.
//
// The meta tags above are belt-and-braces — browsers largely ignore http-equiv
// cache directives, which is why the real work happens here.
(function () {
  var RUNNING = '__BUILD_VERSION__';
  // Unstamped local dev: no version.json, nothing to compare, do nothing.
  if (RUNNING === '__BUILD' + '_VERSION__') return;
  try {
    fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.version || j.version === RUNNING) return;
        // Reload at most once per deployed version, so a misconfigured server
        // can never put the page in a refresh loop.
        var key = 'tb.freshened.' + j.version;
        try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) {}
        location.reload();
      })
      .catch(function () {});
  } catch (e) {}
})();
</script>
<title>ThunderBound — Artillery Duel</title>
<style>
  /* Chunky rounded display font for the HUD (local asset, no external hosts). */
  @font-face {
    font-family: 'Baloo 2';
    src: url('./assets/baloo2.woff2') format('woff2');
    font-weight: 400 800;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --gb-panel: #1b2340;
    --gb-panel-light: #2c3a6b;
    --gb-gold: #ffd75e;
    --gb-red: #ff5b4d;
    --gb-blue: #59c1ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;      /* iOS: the layout viewport is TALLER than the visible
                            area while the Safari toolbar overlays the page, so
                            a 100% console docks below the fold. dvh tracks the
                            area actually on screen; the 100% above is the
                            fallback for engines without dvh. */
    overflow: hidden;
    background: #000;
    position: fixed;     /* kills iOS rubber-band scrolling of the document */
    inset: 0;
    touch-action: none;
  }
  body {
    font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    touch-action: none;                      /* no browser pan/zoom gestures */
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;          /* Safari must not inflate our type */
    text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; }
  canvas#gl { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
  /* Every interactive control opts out of Safari's double-tap-to-zoom. */
  #hud [role="button"], #hud button, #hud .tbtn, #hud .fireBtn,
  #hud .cbtn, #hud .helpBtn, #hud .pauseBtn { touch-action: manipulation; }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="hud"></div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
